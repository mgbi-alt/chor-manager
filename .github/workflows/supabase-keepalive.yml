name: Supabase Keepalive

# Verhindert, dass das kostenlose Supabase-Projekt nach 7 Tagen ohne API-Zugriff
# automatisch pausiert wird. Schickt zweimal pro Woche eine harmlose, minimale
# Leseanfrage an die REST-API. Der verwendete Key ist der oeffentliche anon-Key
# (steht ohnehin in js/config.js im Repo).

on:
  schedule:
    - cron: '0 6 * * 1,4'   # Montag und Donnerstag, 06:00 UTC
  workflow_dispatch: {}      # manuell auslösbar über den "Run workflow"-Button

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "https://nzgmznxwtvmjatbhbmcp.supabase.co/rest/v1/songs?select=id&limit=1" \
            -H "apikey: sb_publishable_rTWG_fw_Us_yA4ZayeR9sw_glQ-rrP-"
